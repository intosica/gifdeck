[package]
name = "gifdeck"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Animated GIF/PNG desktop widgets for COSMIC and X11, managed from a single process"
license = "MIT"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gtk4-layer-shell = "0.7"
gdk4-x11 = "0.10"
x11rb = "0.13"
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
